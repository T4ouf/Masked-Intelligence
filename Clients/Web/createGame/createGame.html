<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create game</title>
    <link href="createGame.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <h1>Create Game</h1>
    </header>
    <main>
      <form name="create-game-form" method="dialog">
        <div>
          <label for="nb-hunters">Number of hunters</label>
          <input name="nb-hunters" type="number" min="1" value="1" required />
        </div>

        <div>
          <label for="nb-androids">Number of androids</label>
          <input name="nb-androids" type="number" min="1" value="1" required />
        </div>

        <div>
          <label for="nb-ais">Number of AIs</label>
          <input name="nb-ais" type="number" min="1" value="2" required />
        </div>

        <div>
          <label for="hunter-turn-duration"
            >Duration of the hunters' turn in minutes</label
          >
          <input
            name="hunter-turn-duration"
            type="number"
            min="1"
            value="2"
            required
          />
        </div>

        <div>
          <label for="android-turn-duration"
            >Duration of the androids' turn in minutes</label
          >
          <input
            name="android-turn-duration"
            type="number"
            min="1"
            value="2"
            required
          />
        </div>

        <div>
          <label for="nb-votes">Number of votes</label>
          <input name="nb-votes" type="number" min="1" value="2" required />
        </div>

        <div>
          <label for="server-ip">IP Address</label>
          <input
            name="server-ip"
            type="text"
            placeholder="server ip"
            value="localhost"
            required
          />
        </div>

        <div>
          <label for="server-port">Port</label>
          <input
            name="server-port"
            type="number"
            min="0"
            max="65535"
            value="9000"
            required
          />
        </div>

        <div>
          <!-- <input type="submit" /> -->
          <button onclick="validateForm()">Create Game</button>
        </div>
      </form>
      <dialog id="waiting-dialog" closedby="none">
        <p id="waiting-dialog-text">Connecting to server...</p>
        <button onclick="cancelConnection()">Cancel</button>
        <button id="start-game-button" onclick="startGame()" hidden>Start</button>
      </dialog>
    </main>
    <script src="../util.js"></script>
    <script src="createGame.js"></script>
  </body>
</html>
