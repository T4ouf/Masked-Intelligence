<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Android chat</title>
    <link href="src/css/androidChat.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <h1>Android chat</h1>
    </header>
    <div class="container">
      <aside class="sidebar">
        <nav>
          <label for="fontScale">Font scale</label>
          <input
            id="fontScale"
            type="number"
            name="fontScale"
            value="1"
            step="0.1"
          />
        </nav>
      </aside>
      <main class="content">
        <section id="chatBox"></section>
        <div class="inputFormDiv">
          <form id="inputForm">
            <textarea
              id="textInput"
              name="textInput"
              rows="5"
              placeholder="Enter your message..."
            ></textarea>
            <input id="submitTextInput" type="submit" value="submit" />
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="/src/js/androidChat.js" defer></script>
  </body>
</html>
