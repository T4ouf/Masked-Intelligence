<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Android chat</title>
    <link href="androidChat.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <h1>Android chat</h1>
    </header>
    <div class="container">
      <aside class="sidebar">
        <nav>
          <div class="fontSizeInputDiv">
            <label for="fontSizeInput">Font size</label>
            <input
              id="fontSizeInput"
              type="number"
              name="fontSize"
              value="1"
              step="0.1"
            />
          </div>
          <button type="button" id="getNextRoundPromptBtn">Get next prompt</button>
        </nav>
      </aside>
      <main class="content">
        <div id="chatBox"></div>
        <div class="textInputDiv">
          <textarea
            id="textInput"
            name="textInput"
            rows="5"
            placeholder="Enter your message..."
          ></textarea>
          <button id="sendBtn" type="button">Send<br />(shortcut: Ctrl+Enter)</button>
        </div>
      </main>
    </div>
    <!-- showdown is a UMD bundle, not an ES module. Adding type=module breaks the export -->
    <script src="../lib/showdown/showdown2.0.min.js"></script>
    <script type="module" src="androidChat.js"></script>
  </body>
</html>
